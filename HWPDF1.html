<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body, html{
        height: 100vh;
        display: flex;
      }
    </style>
  </head>
  <body>
    <svg height="100%" width="100%" style="background-color: black;" viewbox="0 0 180 360" >
        <rect width="20" height="60" y="30" rx="5" ry="5" stroke="black" stroke-width="2" fill="#222"/>
        <circle cx="10" cy="42" r="7" fill="red"/>
        <circle cx="10" cy="60" r="7" fill="gold"/>
        <circle cx="10" cy="78" r="7" fill="limegreen"/>
    </svg>
    <svg height="100%" width="100%" style="background-color: brown;" viewbox="0 0 400 120">
        <rect x="10" y="10" width="80" height="30" fill="blue" rx="7" ry="7"/>
        <circle cx="50" cy="-20" r="20" stroke="white" stroke-width="3" fill="transparent"/>
        <polygon points="40,120 20,140 30,170 53,170, 63,140" fill="gold" stroke-width="2" stroke="black" />
        <polyline points="0,100 15,70 30,100 45,70 60,100 75,70 " fill="transparent" stroke="black" stroke-width="3" />
         <line x1="0" y1="50"
              x2="100" y2="50"
              stroke="white"
              stroke-width="3" 
              stroke-dasharray="8"
              stroke-linecap="round"
              />
        <polygon points="110,0 200,-50 290, 0" fill="red" stroke="black" stroke-width="1"/>
        <rect x="110" y="00" width="180" stroke="black" fill="gold" height="100"/>
        <rect x="130" y="35" width="30" height="30" fill="skyblue" fill-opacity="0.65"/>
        <rect x="180" y="30" width="30" height="70" fill="chocolate" stroke="black"/>
        <rect x="230" y="35" width="30" height="30" fill="skyblue" fill-opacity="0.65"/>
    </svg>
  </body>
</html>
